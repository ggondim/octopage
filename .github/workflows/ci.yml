name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action errors out when the
      # version is pinned in both places, and `packageManager` in
      # package.json is the one that also governs local installs.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the volta pin in package.json. `engines` still allows 22 as
          # the floor, but CI runs what development runs, so a failure here is
          # reproducible locally.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        # Offline on purpose: CI asserts on rendering and routing, not on
        # content freshness, and a PR from a fork has no token to reach the API
        # with anyway.
        env:
          OCTOPAGE_OFFLINE: '1'
        run: pnpm exec playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
