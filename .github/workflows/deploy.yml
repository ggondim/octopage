name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Content lives in Discussions, which change without any commit. Without this
  # the site would only ever be as fresh as the last push.
  discussion:
    types: [created, edited, deleted, labeled, unlabeled, category_changed]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # `code` mode creates the discussion each page pairs with at build time.
  discussions: write

# Let a running deploy finish rather than cancelling it: a half-applied Pages
# deployment is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: template
        env:
          # Discussions are GraphQL-only and reject anonymous requests even for
          # public repos, so the build cannot run without this.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: template/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
