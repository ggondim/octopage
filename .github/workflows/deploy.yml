name: Deploy to GitHub Pages

# Note there is deliberately no `discussion:` trigger and no schedule.
# Discussion content is fetched in the reader's browser, so a new or edited
# discussion is already live — rebuilding on one, or nightly, would spend
# Actions minutes republishing a site whose output does not contain it either
# way. Only committed content needs a build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-applied Pages
# deployment is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action errors out when the
      # version is pinned in both places, and `packageManager` in
      # package.json is the one that also governs local installs.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the volta pin in package.json. `engines` still allows 22 as
          # the floor, but CI runs what development runs, so a failure here is
          # reproducible locally.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        # No token: the build reads only public REST endpoints, and discussion
        # content is fetched in the reader's browser rather than here.
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
