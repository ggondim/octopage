# Preview the *built* site the way each host will actually serve it.
#
# These are not dev servers — `pnpm dev` (Astro, with HMR) is what you want
# while writing. What these catch is the class of bug that only appears after
# the build, where the host's own semantics matter: base-path handling, trailing
# slashes, directory indexes, 404 routing. Those differ between GitHub Pages and
# Vercel, and both differ from `astro preview`.
#
#   docker compose --profile pages up      # GitHub Pages (Jekyll-derived)
#   docker compose --profile vercel up     # Vercel
#
# Build first: `pnpm site:build`.

name: octopage-preview

services:
  # ── GitHub Pages ─────────────────────────────────────────────────────────
  # How the site is actually served once `.nojekyll` is present: files as-is,
  # under the deploy base path, with 404.html returned for any path that has no
  # file.
  #
  # That last part is load-bearing here, not a detail. Discussion-backed pages
  # have no file on disk by design — 404.html is what resolves them — so a
  # preview without the fallback shows a broken site for exactly the half of the
  # content this project added most recently.
  #
  # Same server as the vercel profile, differing only in BASE_PATH.
  pages:
    profiles: ['pages']
    image: node:22-alpine
    working_dir: /repo
    volumes:
      - ..:/repo:ro
    ports:
      - '4000:4000'
    command: ['node', '/repo/scripts/serve.mjs']
    environment:
      SERVE_ROOT: /repo/dist
      VERCEL_JSON: /repo/vercel.json
      # Empty for a root deploy; set to '/your-repo' for a Pages project page.
      BASE_PATH: ${OCTOPAGE_BASE:-/octopage}
      PORT: '4000'

  # ── GitHub Pages, without .nojekyll ──────────────────────────────────────
  # The failure mode, on demand. GitHub Pages runs branch deploys through
  # Jekyll, which drops every top-level path starting with an underscore —
  # including Astro's `_astro/`. The pages still return 200 while every
  # stylesheet and script 404s, which is a miserable thing to discover in
  # production.
  #
  # `public/.nojekyll` is what prevents it. Note Jekyll itself ignores that
  # file: it is a GitHub Pages convention, which is why this is a separate
  # profile rather than something the `pages` profile could detect.
  #
  #   docker compose --profile pages-jekyll up
  #
  # The image is amd64-only, so this runs under emulation on Apple Silicon.
  pages-jekyll:
    profiles: ['pages-jekyll']
    image: jekyll/jekyll:4.2.2
    platform: linux/amd64
    working_dir: /srv/jekyll
    # webrick left Ruby's stdlib in 3.0 and this image never added it back.
    command: >
      sh -lc "gem install webrick --no-document --silent &&
        jekyll serve --no-watch --host 0.0.0.0 --port 4001 --destination /tmp/_site"
    volumes:
      - ../dist:/srv/site:ro
      - ./pages/_config.yml:/srv/jekyll/_config.yml:ro
    ports:
      - '4001:4001'
    environment:
      JEKYLL_ENV: production

  # ── Vercel ───────────────────────────────────────────────────────────────
  # Vercel serves from the web root with no base path and applies vercel.json
  # (trailingSlash, cleanUrls, redirects, headers). A site that works on Pages
  # can still break here purely on the base path, which is what this is for.
  #
  # Stock image plus a mounted script — no Dockerfile, so there is nothing to
  # rebuild when the script changes.
  vercel:
    profiles: ['vercel']
    image: node:22-alpine
    working_dir: /repo
    volumes:
      - ..:/repo:ro
    ports:
      - '3000:3000'
    command: ['node', '/repo/scripts/serve.mjs']
    environment:
      SERVE_ROOT: /repo/dist
      VERCEL_JSON: /repo/vercel.json
      PORT: '3000'