# Used only on the branch where `.nojekyll` is absent, i.e. when GitHub Pages
# would run the tree through Jekyll. See docker-compose.yml for why that branch
# exists and what it demonstrates.
#
# Processing stays ON deliberately: the point is to reproduce Jekyll dropping
# `_astro/`, not to avoid it.
source: /srv/site
destination: /tmp/_site
incremental: false
plugins: []

# The source is mounted read-only, and `cache_dir` is resolved relative to the
# source, so no path can escape it — disabling the disk cache is the only way
# out. Irrelevant anyway: the site is already built, Jekyll only re-emits it.
disable_disk_cache: true
